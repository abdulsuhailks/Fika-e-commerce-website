


    <!-- <app-navbar></app-navbar> -->

  <div *ngIf="Product" class=" p-4 border rounded bg-light ">
    <div class="d-flex justify-content-center mb-3">
      <img [src]="'http://127.0.0.1:8000' + Product.image" class="justify-content-center" height="400px" *ngIf="Product.image" class="mb-3">
    </div>
    <h4>{{ Product.name }}</h4>
    <p><strong>Description:</strong> {{ Product.description }}</p>
    <p><strong>Price:</strong> ₹{{ Product.price }}</p>
    <p><strong>Stock:</strong> {{ Product.stock }}</p>
    <p><strong>Size:</strong> {{ Product.size }}</p>

    <div class="mb-2">
  <label for="qty">Quantity:</label>
  <input type="number" min="1" [(ngModel)]="quantity" class="form-control w-25" />
</div>


    <button class="btn btn-warning" (click)="addtocart(Product)" ><strong>Add to Cart</strong></button> &nbsp;
    <button class="btn btn-warning justify-content-end" (click)="buyNow(Product)" ><strong>Buy now</strong></button>


  </div>
