
<nav class="navbar bg-body-tertiary fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand"> <img src="assets/images/logo.png" alt="Logo" class="logo mt-2"> </a>
    <div class="d-flex" role="search">
      <button class="btn btn-outline-success" (click)="logs()">Signup</button>
    </div>
  </div>
</nav>


<div class="d-flex justify-content-center">
    <h1 class="mt-5 pt-4">Register</h1>
</div>
<div class="d-flex justify-content-center">
    <form #log="ngForm" (ngSubmit)="registerdata(log.value)">
        <input type="text" name="username" placeholder="username" class="form-control custom-width mt-2 " ngModel required >
        <input type="text" name="first_name" placeholder="first_name" class="form-control custom-width mt-2 " ngModel required >
        <input type="text" name="last_name" placeholder="last_name" class="form-control custom-width mt-2 " ngModel required >
        <select name="gender" class="form-control custom-width mt-2" ngModel required >
            <option value="" disabled selected>Select gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
        </select> 
        <input type="number" name="phone_number" placeholder="phone_number" class="form-control custom-width mt-2 " ngModel required > 
        <input type="email" name="email" placeholder="email" class="form-control custom-width mt-2 " ngModel required >
        <input type="password" name="password" placeholder="password" class="form-control custom-width mt-2 " ngModel required >
        <div class="d-grid gap-2">
            <input type="submit" value="Save" class="btn btn-success mt-2 ">
        </div>
    </form>
</div>

<div class="d-flex justify-content-center">
    <p class="mt-3">Already have an account?</p>
<button class="btn btn-link " (click)="logs()">Login</button>
</div>
