<main class="auth-page">
  <section class="auth-card register-card">
    <h1>Create your account</h1>
    <p class="auth-subtitle">Join FIKA and discover your next favourite piece.</p>
    <form #log="ngForm" (ngSubmit)="registerdata(log.value)">
      <div class="auth-grid">
        <input type="text" name="username" placeholder="Username" class="form-control" ngModel required>
        <input type="email" name="email" placeholder="Email address" class="form-control" ngModel required>
        <input type="text" name="first_name" placeholder="First name" class="form-control" ngModel required>
        <input type="text" name="last_name" placeholder="Last name" class="form-control" ngModel required>
        <select name="gender" class="form-control" ngModel required>
          <option value="" disabled selected>Select gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
        <input type="number" name="phone_number" placeholder="Phone number" class="form-control" ngModel required>
        <input type="password" name="password" placeholder="Password" class="form-control full" ngModel required>
        <div class="d-grid full">
          <input type="submit" value="Create account" class="btn btn-success">
        </div>
      </div>
    </form>
    <div class="d-flex justify-content-center align-items-center mt-2">
      <span>Already have an account?</span>
      <button class="btn btn-link" type="button" (click)="logs()">Login</button>
    </div>
  </section>
</main>
