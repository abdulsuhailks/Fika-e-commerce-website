<button class="btn btn-primary" (click)="addproduct()">Add Product</button>
<button class="btn btn-primary" (click)="addproduct()">Add Product</button>

<div class="container">
  <h2>Product List</h2>
  <table class="table table-bordered">
    <thead>
      <tr>
        <th>Product ID</th>
        <th>Product Image</th>
        <th>Product Name</th>
        <th>Product Price</th>
        <th>Product Description</th>
        <th>Product Stock</th>
        <th>Product Size</th>
        <th>Product Category</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let product of product">
        <td>{{ product.product_id_no }}</td>
        <td> <img *ngIf="product.image" [src]="'http://127.0.0.1:8000' + product.image" class="card-img-top" alt="Product Image" height="100px" width="50px"> </td>
        <td>{{ product.name }}</td>
        <td>{{ product.price }}</td>
        <td>{{ product.description }}</td>
        <td>{{ product.stock }}</td>
        <td>{{ product.size }}</td>
        <td>{{ product.category }}</td>
        <td>
          <button class="btn btn-warning"  [routerLink]="['/editproduct', product.id]"> Edit</button>
          &nbsp;
          <button class="btn btn-danger" (click)="deleteProduct(product.id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
