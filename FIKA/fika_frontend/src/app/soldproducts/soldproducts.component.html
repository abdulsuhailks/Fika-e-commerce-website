<h2>Sold Products</h2>

<table class="table table-bordered">
  <thead>
    <tr>
      <th>Order ID</th>
      <th>Product Name</th>
      <th>Quantity</th>
      <th>Price</th>
      <th>User</th>
      <th>Address</th>
      <th>Date</th>
      <th>Status</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let p of soldProducts">
      <td>{{ p.id }}</td>
      <td>{{ p.product_name }}</td>
      <td>{{ p.quantity }}</td>
      <td>{{ p.price }}</td>
      <td>{{ p.username }}</td>
      <td>{{ p.address }}</td>
      <td>{{ p.order_date }}</td>
      <td>
        {{ p.status }}
        <div *ngIf="p.status === 'Pending'" class="mt-2">
          <button class="btn btn-primary btn-sm" (click)="deliverOrder(p.id)">Deliver</button>
        </div>
      </td>
    </tr>
  </tbody>
</table>
