
<main class="auth-page">
  <section class="auth-card">
    <h1>Welcome back</h1>
    <p class="auth-subtitle">Sign in to continue shopping with FIKA.</p>
    <form #log="ngForm" (ngSubmit)="logindata(log.value)">
      <label class="form-label visually-hidden" for="login-username">Username</label>
      <input id="login-username" type="text" name="username" placeholder="Username" class="form-control" ngModel required>
      <label class="form-label visually-hidden" for="login-password">Password</label>
      <input id="login-password" type="password" name="password" placeholder="Password" class="form-control" ngModel required>
      <div class="d-grid gap-2">
        <input type="submit" value="Login" class="btn btn-success">
      </div>
    </form>
    <div class="text-center mt-3">
      <button class="btn btn-link" type="button" (click)="forgot()">Forgot your password?</button>
    </div>
    <div class="d-flex justify-content-center align-items-center mt-2">
      <span>Don't have an account?</span>
      <button class="btn btn-link" type="button" (click)="reg()">Create account</button>
    </div>
  </section>
</main>
