

<nav class="navbar bg-body-tertiary fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand"> <img src="assets/images/logo.png" alt="Logo" class="logo mt-2"> </a>
  </div>
</nav>


<div class="d-flex justify-content-center">
    <h1 class="mt-5 pt-4">Login</h1>
</div>

<div class="d-flex justify-content-center">
    <form #log="ngForm" (ngSubmit)="logindata(log.value)">
        <input type="text" name="username" placeholder="username" class="form-control mt-2 " ngModel >
        <input type="password" name="password" placeholder="password" class="form-control mt-2 " ngModel >
        <div class="d-grid gap-2">
            <input type="submit" value="Login" class="btn btn-success mt-2 ">
        </div>
    </form>
</div>
<div class="d-flex justify-content-center">
    <button class="btn btn-link " (click)="forgot()">Forgot your password?</button>
</div>

<div class="d-flex justify-content-center">
    <p class="mt-3">Don't have an account?</p>
    <button class="btn btn-link " (click)="reg()">Register</button>
</div>
