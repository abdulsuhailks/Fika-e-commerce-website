

<nav class="app-navbar">
  <button id="sidebarToggle" class="nav-menu-btn navbar-toggler" type="button" aria-label="Open navigation" (click)="$event.stopPropagation(); toggleSidebar()">
    <span class="navbar-toggler-icon"></span>
  </button>
  <a class="navbar-logo" (click)="isAdmin ? adminHome() : home()" style="cursor:pointer">
    <img src="assets/images/logo.png" alt="FIKA logo">
  </a>
  <form class="navbar-search" role="search" (ngSubmit)="search()">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m1.35-5.65a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input type="search" [(ngModel)]="searchQuery" name="navbarSearch" placeholder="Search products" aria-label="Search products">
    <button type="submit">Search</button>
  </form>
</nav>

<div [ngClass]="{'sidebar-open': isSidebarOpen, 'sidebar-closed': !isSidebarOpen}" class="sidebar bg-dark text-white p-3">
  <ul class="list-unstyled">
    <ng-container *ngIf="isAdmin; else userLinks">
      <li><button class="text-white btn btn-link" (click)="adminHome()">Admin Home</button></li>
      <li><button class="text-white btn btn-link" (click)="adminAddProduct()">Add Product</button></li>
      <li><button class="text-white btn btn-link" (click)="adminViewProduct()">View Products</button></li>
      <li><button class="text-white btn btn-link" (click)="adminSoldProducts()">Sold Products</button></li>
      <li><button class="text-white btn btn-link" (click)="Logout()">Logout</button></li>
    </ng-container>
    <ng-template #userLinks>
      <li><button class="text-white btn btn-link" (click)="home()">Home</button></li>
      <li><button class="text-white btn btn-link" (click)="viewProfile()">Profile</button></li>
      <li><button class="text-white btn btn-link" (click)="addaddress()">Add Address</button></li>
      <li><button class="text-white btn btn-link" (click)="viewcart()">Cart</button></li>
      <li><button class="text-white btn btn-link" (click)="orders()" >Orders</button></li>
      <li><button class="text-white btn btn-link" (click)="Logout()" >Logout</button></li>
    </ng-template>
  </ul>
</div>
