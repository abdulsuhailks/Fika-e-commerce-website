<main class="page-shell">
  <section class="content-wrap">
    <div class="section-heading">
      <div>
        <p class="text-uppercase text-muted mb-1">FIKA Collection</p>
        <h2>{{ products[0]?.category || 'Products' }}</h2>
      </div>
    </div>
    <form class="store-search mb-4" role="search" (ngSubmit)="search()">
      <input type="search" [(ngModel)]="searchQuery" name="search" placeholder="Search products" aria-label="Search">
      <button type="submit">Search</button>
    </form>
    <div class="product-grid">
      <article class="card" *ngFor="let product of products" (click)="viewProduct(product.id)" style="cursor:pointer">
        <img [src]="'http://127.0.0.1:8000' + product.image" class="card-img-top" alt="{{ product.name }}" *ngIf="product.image">
        <div class="card-body">
          <h5 class="card-title">{{ product.name }}</h5>
          <p class="card-text text-truncate">{{ product.description }}</p>
          <p class="card-text mb-1"><strong>Stock:</strong> {{ product.stock }} &nbsp; <strong>Size:</strong> {{ product.size }}</p>
          <p class="price mb-0"><strong>₹{{ product.price }}</strong></p>
        </div>
      </article>
    </div>
  </section>
</main>
