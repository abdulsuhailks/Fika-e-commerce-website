<nav class="navbar bg-body-tertiary">
  <div class=" d-flex justify-content-center container-fluid">

    <form class="d-flex" role="search">
      <input class=" me-2 ser" type="search" [(ngModel)]="searchQuery" name="search" placeholder="Search products" aria-label="Search" />
      <button class="btn btn-outline-success" (click)="search()">Search</button>
    </form>
  </div>
</nav>


<div class="container mt-4">
  <div class="row" *ngIf="results.length > 0; else noResults">
    <div class="col-md-3" *ngFor="let product of results">
      <div class="card mb-4 shadow-sm" (click)="viewProduct(product.id)" style="cursor: pointer;">
        <img [src]="'http://127.0.0.1:8000' + product.image" class="card-img-top" height="300px" alt="..." *ngIf="product.image">
        <div class="card-body">
          <h5 class="card-title">{{ product.name }}</h5>
          <p class="card-text">{{ product.description }}</p>
          <p class="card-text"><strong>Stock:</strong> {{ product.stock }}</p>
          <p class="card-text"><strong>Size:</strong> {{ product.size }}</p>
          <p class="card-text">₹{{ product.price }}</p>
        </div>
      </div>
    </div>
  </div>
</div>


<ng-template #noResults>
  <p>No products found.</p>
</ng-template>
