<main class="page-shell">
  <section class="store-hero">
    <h1>Style made for everyday.</h1>
    <p>Thoughtfully selected pieces, made to feel unmistakably yours.</p>
    <form class="store-search" role="search" (ngSubmit)="search()">
      <input type="search" [(ngModel)]="searchQuery" name="search" placeholder="Search the collection" aria-label="Search products">
      <button type="submit">Search</button>
    </form>
  </section>

  <section class="content-wrap">
    <div class="section-heading">
      <h2>Shop by category</h2>
    </div>
    <div class="category-grid">
      <article class="card" *ngFor="let product of products" (click)="viewCategory(product.category)" style="cursor:pointer">
        <img [src]="'http://127.0.0.1:8000' + product.image" class="card-img-top" alt="{{ product.category }}" *ngIf="product.image">
        <div class="card-body">
          <h5 class="card-title mb-0">{{ product.category }}</h5>
        </div>
      </article>
    </div>
  </section>
</main>
